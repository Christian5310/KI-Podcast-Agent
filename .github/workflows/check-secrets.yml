name: Secrets-Diagnose (Zeilenumbrueche pruefen)

# Manuell auslösbar, kein Scheduler. Prueft alle Secrets auf haeufige Kopierfehler
# (fuehrende/angehaengte Leerzeichen, Zeilenumbrueche) OHNE die eigentliche Pipeline
# anzustossen - schnell und kostenlos, statt bei jedem kaputten Secret den ganzen
# teuren Morgenlauf neu zu triggern.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Auf Zeilenumbrueche/Leerzeichen pruefen
        run: |
          python3 - <<'PYEOF'
          import os

          names = [
              "SUPABASE_URL", "SUPABASE_KEY", "ANTHROPIC_API_KEY",
              "DEEPSEEK_API_KEY", "DEEPSEEK_BASE_URL", "ELEVENLABS_API_KEY",
              "ELEVENLABS_VOICE_INTRO", "EXA_API_KEY",
          ]
          problems = []
          for name in names:
              val = os.environ.get(name, "")
              if not val:
                  problems.append(f"{name}: FEHLT/LEER")
                  continue
              issues = []
              if val != val.strip():
                  issues.append("fuehrende/angehaengte Leer-/Zeilenumbruch-Zeichen")
              if "\n" in val or "\r" in val:
                  issues.append("Zeilenumbruch MITTEN im Wert")
              if issues:
                  problems.append(f"{name}: {', '.join(issues)} (Laenge: {len(val)})")
              else:
                  print(f"OK: {name} (Laenge: {len(val)})")

          if problems:
              print("\nPROBLEME GEFUNDEN:")
              for p in problems:
                  print(f"  - {p}")
              raise SystemExit(1)
          print("\nAlle Secrets sauber.")
          PYEOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_INTRO: ${{ secrets.ELEVENLABS_VOICE_INTRO }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
