name: Takt 1 - Sammeln & Aufbereiten

# Nicht zeitkritisch (siehe Architektur), laeuft 2x/Tag, auch am Wochenende
# (fuer den Montag-Rueckblick). Zweiter Lauf abends vor dem 23-Uhr-Redaktionsschluss.
on:
  schedule:
    - cron: "0 11 * * *"  # 13:00 MESZ
    - cron: "0 20 * * *"  # 22:00 MESZ, letzter Lauf vor dem Redaktionsschluss
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_collect.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
